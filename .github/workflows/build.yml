name: Build

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: Windows x64
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'

      - name: Arayüz derle
        working-directory: apps/desktop
        run: |
          npm ci
          npm run build

      - name: Testler
        run: cargo test --workspace --locked

      - name: Release derle
        run: cargo build --release -p enes-launcher-app --locked

      # Bu iki adım başlangıçta uyarı üretebilir. Kod tabanı temizlendiğinde
      # `continue-on-error` satırları silinip zorunlu hale getirilebilir.
      - name: Format kontrolü
        continue-on-error: true
        run: cargo fmt --all -- --check

      - name: Clippy
        continue-on-error: true
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Artefaktı yükle
        uses: actions/upload-artifact@v4
        with:
          name: EnesLauncher-windows-x64
          path: target/release/enes-launcher-app.exe
          if-no-files-found: error

      - name: Release'e ekle
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: target/release/enes-launcher-app.exe
